<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Dhakaia Dine Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-utensils"></i> Dhakaia Dine</h3>
            </div>
            <ul class="list-unstyled components">
                <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="orders.html"><i class="fas fa-shopping-cart"></i> Orders</a></li>
                <li><a href="foods.html"><i class="fas fa-hamburger"></i> Foods</a></li>
                <li><a href="categories.html"><i class="fas fa-list"></i> Categories</a></li>
                <li><a href="banners.html"><i class="fas fa-images"></i> Banners</a></li>
                <li><a href="branches.html"><i class="fas fa-store"></i> Branches</a></li>
                <li><a href="tables.html"><i class="fas fa-chair"></i> Tables</a></li>
                <li><a href="customers.html"><i class="fas fa-users"></i> Customers</a></li>
                <li class="active"><a href="analytics.html"><i class="fas fa-chart-line"></i> Analytics</a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </nav>

        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-custom">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn-sidebar"><i class="fas fa-bars"></i></button>
                    <div class="ms-auto user-profile">
                        <span id="userEmail">admin@dhakaiadine.com</span>
                        <div class="dropdown">
                            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" style="background: transparent; border: none; color: var(--gold-primary);">
                                <i class="fas fa-user-circle fa-lg"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
                                <li><a class="dropdown-item" href="settings.html">Settings</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">Logout</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>

            <div class="container-fluid p-4">
                <h2 class="text-gold mb-4">Analytics & Reports</h2>

                <div class="row g-4 mb-4">
                    <div class="col-12 col-md-6">
                        <div class="card bg-card border-secondary h-100">
                            <div class="card-header border-secondary text-gold">Monthly Revenue</div>
                            <div class="card-body">
                                <canvas id="monthlyRevenueChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="card bg-card border-secondary h-100">
                            <div class="card-header border-secondary text-gold">Popular Categories</div>
                            <div class="card-body d-flex align-items-center justify-content-center">
                                <canvas id="categoriesChart" style="max-height: 250px;"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gold = '#d4af37';
            const bg = 'rgba(212, 175, 55, 0.1)';
            
            new Chart(document.getElementById('monthlyRevenueChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [{
                        label: 'Revenue',
                        data: [1200, 1900, 3000, 2500, 3200, 4100],
                        backgroundColor: gold
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });

            new Chart(document.getElementById('categoriesChart').getContext('2d'), {
                type: 'pie',
                data: {
                    labels: ['Burgers', 'Pizza', 'Drinks', 'Desserts'],
                    datasets: [{
                        data: [40, 25, 20, 15],
                        backgroundColor: ['#e74c3c', '#f1c40f', '#3498db', '#2ecc71'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true }
            });
        });
    </script>
</body>
</html>
