<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banners - Dhakaia Dine Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .banner-preview {
            width: 150px;
            height: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-utensils"></i> Dhakaia Dine</h3>
            </div>
            <ul class="list-unstyled components">
                <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="orders.html"><i class="fas fa-shopping-cart"></i> Orders</a></li>
                <li><a href="foods.html"><i class="fas fa-hamburger"></i> Foods</a></li>
                <li><a href="categories.html"><i class="fas fa-list"></i> Categories</a></li>
                <li class="active"><a href="banners.html"><i class="fas fa-images"></i> Banners</a></li>
                <li><a href="branches.html"><i class="fas fa-store"></i> Branches</a></li>
                <li><a href="tables.html"><i class="fas fa-chair"></i> Tables</a></li>
                <li><a href="customers.html"><i class="fas fa-users"></i> Customers</a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg navbar-custom">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn-sidebar"><i class="fas fa-bars"></i></button>
                    <div class="ms-auto user-profile">
                        <span id="userEmail">admin@dhakaiadine.com</span>
                        <div class="dropdown">
                            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" style="background: transparent; border: none; color: var(--gold-primary);">
                                <i class="fas fa-user-circle fa-lg"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
                                <li><a class="dropdown-item" href="settings.html">Settings</a></li>
                                <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">Logout</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Main Content Area -->
            <div class="container-fluid p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="text-gold">Banner Management</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bannerModal" id="btnAddBanner">
                        <i class="fas fa-plus"></i> Add Banner
                    </button>
                </div>

                <div class="row g-4" id="bannersList">
                    <!-- Banners injected here dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="bannerModal" tabindex="-1" data-bs-theme="dark">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="background-color: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color);">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-gold" id="bannerModalLabel">Add Banner</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="bannerForm">
                    <div class="modal-body">
                        <input type="hidden" id="bannerId">
                        <input type="hidden" id="existingImageUrl">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Offer Text</label>
                                <input type="text" class="form-control" id="bannerOfferText" placeholder="e.g. 50% OFF Weekend">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Button Text</label>
                                <input type="text" class="form-control" id="bannerButtonText" placeholder="e.g. Order Now">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Expiry Date</label>
                                <input type="date" class="form-control" id="bannerExpiry">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Sort Order</label>
                                <input type="number" class="form-control" id="bannerSortOrder" value="0">
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="bannerEnabled" checked>
                                    <label class="form-check-label">Enable Banner</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Description</label>
                                <textarea class="form-control" id="bannerDescription" rows="2"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Banner Image <span class="text-danger">*</span></label>
                                <input type="file" class="form-control" id="bannerImage" accept="image/*">
                            </div>
                            <div class="col-12 d-none" id="imagePreviewContainer">
                                <img id="imagePreview" src="" alt="Preview" style="max-height: 100px; border-radius: 8px;">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="btnSaveBanner">Save Banner</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/main.js"></script>
    <script type="module" src="assets/js/banners.js"></script>
</body>
</html>
