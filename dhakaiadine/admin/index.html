<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhakaia Dine - Admin Redirect</title>
    <script type="module">
        import { supabase } from './supabase/config.js';

        async function checkSession() {
            const isStaticAdmin = localStorage.getItem('static_admin') === 'true';
            if (isStaticAdmin) {
                window.location.replace('dashboard.html');
                return;
            }
            
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.replace('dashboard.html');
            } else {
                window.location.replace('login.html');
            }
        }

        checkSession();
    </script>
</head>
<body style="background-color: #121212; color: #d4af37; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
    <h2>Loading...</h2>
</body>
</html>
