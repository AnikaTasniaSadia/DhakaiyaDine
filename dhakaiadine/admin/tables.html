<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables - Dhakaia Dine Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .table-dark {
            --bs-table-bg: var(--bg-card);
            --bs-table-striped-bg: rgba(255, 255, 255, 0.05);
            --bs-table-border-color: var(--border-color);
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-utensils"></i> Dhakaia Dine</h3>
            </div>
            <ul class="list-unstyled components">
                <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="orders.html"><i class="fas fa-shopping-cart"></i> Orders</a></li>
                <li><a href="foods.html"><i class="fas fa-hamburger"></i> Foods</a></li>
                <li><a href="categories.html"><i class="fas fa-list"></i> Categories</a></li>
                <li><a href="banners.html"><i class="fas fa-images"></i> Banners</a></li>
                <li><a href="branches.html"><i class="fas fa-store"></i> Branches</a></li>
                <li class="active"><a href="tables.html"><i class="fas fa-chair"></i> Tables</a></li>
                <li><a href="customers.html"><i class="fas fa-users"></i> Customers</a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </nav>

        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-custom">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn-sidebar"><i class="fas fa-bars"></i></button>
                    <div class="ms-auto user-profile">
                        <span id="userEmail">admin@dhakaiadine.com</span>
                        <div class="dropdown">
                            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" style="background: transparent; border: none; color: var(--gold-primary);">
                                <i class="fas fa-user-circle fa-lg"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
                                <li><a class="dropdown-item" href="settings.html">Settings</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="#" id="logoutBtn">Logout</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>

            <div class="container-fluid p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="text-gold">Table Management</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#tableModal" id="btnAddTable">
                        <i class="fas fa-plus"></i> Add Table
                    </button>
                </div>

                <div class="card bg-card border-secondary">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table id="restaurantTablesTable" class="table table-dark table-striped table-hover align-middle w-100">
                                <thead>
                                    <tr>
                                        <th>Table Name/No</th>
                                        <th>Branch ID</th>
                                        <th>Capacity</th>
                                        <th>Floor</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="tableModal" tabindex="-1" data-bs-theme="dark">
        <div class="modal-dialog">
            <div class="modal-content" style="background-color: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color);">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-gold" id="tableModalLabel">Add Table</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="tableForm">
                    <div class="modal-body">
                        <input type="hidden" id="tableId">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Table Name / No <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="tableName" required placeholder="e.g. T-01">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Branch ID</label>
                                <input type="text" class="form-control" id="tableBranch">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Capacity <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="tableCapacity" required value="4">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Floor</label>
                                <input type="text" class="form-control" id="tableFloor" placeholder="e.g. Ground Floor">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Status <span class="text-danger">*</span></label>
                                <select class="form-select" id="tableStatus" required>
                                    <option value="available">Available</option>
                                    <option value="reserved">Reserved</option>
                                    <option value="occupied">Occupied</option>
                                    <option value="cleaning">Cleaning</option>
                                    <option value="disabled">Disabled</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="btnSaveTable">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script type="module" src="assets/js/main.js"></script>
    <script type="module" src="assets/js/tables.js"></script>
</body>
</html>
